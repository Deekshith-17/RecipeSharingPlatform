<html>
<head>
     <title>Recipe Search</title>
    <style>
        /* General Page Styling */
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #ffcc70, #ff758c);
            padding: 20px;
        }

        /* Search Container */
        .search-container {
            width: 60%;
            margin: auto;
            padding: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 4px 4px 15px rgba(0, 0, 0, 0.2);
        }

        /* Search Bar */
        input {
            width: 80%;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid #d2691e;
            outline: none;
            font-size: 16px;
        }

        /* Search Button */
        button {
            padding: 12px 20px;
            background-color: #8b0000;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #a52a2a;
        }

        /* Sidebar for Matching Recipes */
        .sidebar {
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 10px;
            box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.2);
        }

        .recipe-list {
            list-style: none;
            padding: 0;
        }

        .recipe-list li {
            padding: 8px;
            cursor: pointer;
            color: #d2691e;
            font-size: 18px;
            text-align: left;
        }

        .recipe-list li:hover {
            text-decoration: underline;
        }

        /* Back Button */
        .back-button {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 16px;
            background: #008000;
            color: white;
            border-radius: 8px;
            text-decoration: none;
        }

        .back-button:hover {
            background: #006400;
        }

    </style>
</head>
<body>
    <div class="search-container">
        <h1>🔍 Search for a Recipe</h1>
        <input type="text" id="searchInput" placeholder="Enter recipe name..." onkeyup="filterRecipes()">
        <button onclick="searchRecipe()">Search</button>
    </div>

    <!-- Sidebar Showing Matching Recipes -->
    <div class="sidebar">
        <h2>Matching Recipes</h2>
        <ul id="recipeList" class="recipe-list"></ul>
    </div>

    <!-- Back Button to Main Page -->
    <a href="../DashBoardHTML/main.html" class="back-button">⬅️ Back to Main Page</a>

    <script>
        let recipes = {
            "pasta recipe": "../DescriptionHTML/p.html",
            "chocolate cake recipe": "../DescriptionHTML/p1.html",
            "burger recipe": "../DescriptionHTML/p2.html",
            "lava cake recipe": "../DescriptionHTML/p3.html",
            "strawberry ice cream recipe": "../DescriptionHTML/p4.html",
            "pizza recipe": "../DescriptionHTML/p5.html",
            "vanilla ice cream recipe": "../DescriptionHTML/p6.html",
            "honey cake recipe": "../DescriptionHTML/p7.html",
            "butterscotch ice cream recipe": "../DescriptionHTML/p8.html"
        };

        function searchRecipe() {
            let searchValue = document.getElementById('searchInput').value.toLowerCase().trim();
            if (recipes[searchValue]) {
                window.location.href = recipes[searchValue]; 
            } else {
                alert("Recipe not found! Try another name.");
            }
        }

        function filterRecipes() {
            let inputValue = document.getElementById('searchInput').value.toLowerCase().trim();
            let listContainer = document.getElementById('recipeList');
            listContainer.innerHTML = "";

            Object.keys(recipes).forEach(recipe => {
                if (recipe.includes(inputValue) && inputValue !== "") {
                    let listItem = document.createElement('li');
                    listItem.innerText = recipe;
                    listItem.onclick = () => window.location.href = recipes[recipe];
                    listContainer.appendChild(listItem);
                }
            });
        }
    </script>
</body>
</html>
