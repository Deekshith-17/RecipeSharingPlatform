<html>
<head>
     <title>Login - Recipe Sharing Platform</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <h1 class="main-heading">Recipe Sharing Platform</h1> <!-- Big Stylish Heading -->

    <div class="login-container">
        <h2 class="centered-heading">🔐 Login to Your Recipe Hub 🍽️</h2>

        <form id="loginForm">
            <label for="loginEmail">Email:</label>
            <input type="email" id="loginEmail" placeholder="Enter your email" required>

            <label for="loginPassword">Password:</label>
            <input type="password" id="loginPassword" placeholder="Enter your password" required>

            <div class="button-group">
                <button type="submit">Login</button>
                <button type="button" id="resetLogin">Reset</button> <!-- Fixed Reset Button -->
            </div>

            <p class="forgot-password"><a href="#">Forgot Password?</a></p>
            <p class="register-option"><a href="register.html">New User? Register Here</a></p> <!-- Redirects to registration -->
        </form>
    </div>

    <!-- Sidebar Redirect -->
    <a href="subscription.html">
        <button id="sidebarToggle">❮ Subscription</button>
    </a>

    <script src="login.js"></script>
</body>
</html>
